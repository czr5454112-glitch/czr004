schema_version: phase4_laur_batch_config_v1
mode: pilot

build_dir: build/phase4-laur-ltm
binary: build/phase4-laur-ltm/phase4_laur_record
probe_binary: build/phase4-laur-ltm/phase4_laur_probe

time_limit_sec: 5
max_iterations: 4
checkpoint_topk_edges: 16

scenario_manifest: configs/phase1a/manifest.jsonl
scenario_output_dir: outputs/tmp/phase1a/generated/phase1a-generated-random
scenario_output_zip: outputs/tmp/phase1a/generated/phase1a-generated-random.zip
scenario_metadata: outputs/reports/phase1a_generated_scenarios_manifest.json
scen_template: outputs/tmp/phase1a/generated/phase1a-generated-random/{map_name}-random-{instance}.scen

checkpoint_jsonl: artifacts/teacher/laur/pilot/checkpoints/phase4_laur_checkpoints_pilot.jsonl
trace_jsonl: artifacts/teacher/laur/pilot/traces/phase4_laur_trace_pilot.jsonl
traffic_snapshot_root: artifacts/teacher/laur/pilot/checkpoints/snapshots
probe_output_jsonl: artifacts/teacher/laur/pilot/probes/phase4_laur_probe_pilot.jsonl
update_label_jsonl: artifacts/teacher/laur/pilot/update_labels/phase4_laur_best_rule_labels_pilot.jsonl
dataset_jsonl: artifacts/teacher/laur/pilot/update_labels/phase4_laur_update_dataset_pilot.jsonl
dataset_summary_csv: outputs/tables/phase4_laur_update_dataset_pilot_summary.csv
dataset_summary_json: outputs/reports/phase4_laur_update_dataset_pilot_summary.json
model_output_dir: artifacts/models/laur_ltm/pilot
train_report_md: outputs/reports/phase4_laur_ltm_train_pilot.md
offline_eval_report_md: outputs/reports/phase4_laur_ltm_offline_eval_pilot.md
offline_eval_summary_csv: outputs/tables/phase4_laur_ltm_offline_eval_pilot.csv
offline_eval_summary_json: outputs/reports/phase4_laur_ltm_offline_eval_pilot_summary.json
batch_summary_json: outputs/reports/phase4_laur_ltm_pilot_batch_summary.json
batch_report_md: outputs/reports/phase4_laur_ltm_pilot_batch_report.md
log_dir: outputs/logs/phase4_laur_pilot

probe:
  enabled: true
  short_budget_sec: 1.0
  max_checkpoints_per_run: 4
  min_delta_ratio_for_label: 0.005
  harmful_delta_ratio_threshold: -0.02
  harmful_ttfs_regression_ratio: 1.20
  rule_set:
    - additive_ltm
    - commit_heavy
    - block_heavy
    - block_light
    - wait_light
    - wait_heavy
    - decay_095
    - decay_090

training:
  epochs: 300
  hidden_dim: 64
  learning_rate: 0.01
  weight_decay: 0.0001
  seed: 7

agent_counts:
  - 50
  - 100
instances:
  - 1
  - 2
  - 3
  - 4
  - 5

maps:
  - map_name: empty-32-32
    map_path: external/lacam2/scripts/map/empty-32-32.map
    split: train
  - map_name: random-32-32-20
    map_path: external/lacam2/scripts/map/random-32-32-20.map
    split: train
  - map_name: random-64-64-20
    map_path: external/lacam2/scripts/map/random-64-64-20.map
    split: train
  - map_name: room-64-64-8
    map_path: external/lacam2/scripts/map/room-64-64-8.map
    split: train
  - map_name: warehouse-10-20-10-2-1
    map_path: external/lacam2/scripts/map/warehouse-10-20-10-2-1.map
    split: train
  - map_name: warehouse-10-20-10-2-2
    map_path: external/lacam2/scripts/map/warehouse-10-20-10-2-2.map
    split: train
  - map_name: empty-48-48
    map_path: external/lacam2/scripts/map/empty-48-48.map
    split: validation
  - map_name: maze-32-32-4
    map_path: external/lacam2/scripts/map/maze-32-32-4.map
    split: validation
