schema_version: phase3_teacher_config_v1
source_manifest: configs/phase1a/manifest_plus_3000.jsonl
generated_scenarios_root: outputs/tmp/phase1a/generated
output_manifest: artifacts/teacher/manifest.jsonl
run_log_jsonl: outputs/logs/phase3/teacher_smoke_runs.jsonl
report_md: outputs/reports/phase3_teacher_data_report.md
split_audit_csv: outputs/tables/phase3_teacher_split_audit.csv
dataset_summary_csv: outputs/tables/phase3_teacher_dataset_summary.csv
label_root: artifacts/teacher/edge_labels
binary: build/phase1a-batch/phase1a_batch.exe
time_limit_sec: 3
ltm_max_iterations: 100000
sample_instances:
  - 1
agent_policy: fixed
agent_count: 50
edge_filter: all
primary_supervision: online_residual
warm_start_target: ltm_normalized_edge_weight
trace_schema_version: phase3_pibt_trace_v1
edge_label_schema_version: phase3_edge_label_v1
split_rule:
  type: map_holdout_v1
  train:
    - empty-32-32
    - random-32-32-20
    - random-64-64-20
    - room-64-64-8
    - warehouse-10-20-10-2-1
    - warehouse-10-20-10-2-2
  validation:
    - empty-48-48
  test:
    - maze-32-32-4
